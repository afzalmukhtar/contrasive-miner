[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contrastive-miner"
version = "0.1.0"
description = "A two-stage hard negative mining library for contrastive learning"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["embeddings", "triplet-loss", "hard-negatives", "contrastive-learning", "sentence-transformers"]
authors = [
    { name = "Afzal" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.21.0",
    "pydantic>=2.0.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/contrastive_miner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
